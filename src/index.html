<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="super-terminal-token" content="__TOKEN__">
  <title>Super Terminal</title><link rel="stylesheet" href="/app.css">
</head>
<body>
  <aside id="sidebar">
    <select id="environment" aria-label="Environment"><option value="local">Local</option></select>
    <button id="conductor-nav" class="nav-item">Conductor</button>
    <button id="team-messages-nav" class="nav-item" hidden>Team messages</button>
    <div id="environment-status" role="status"></div>
    <nav id="terminals" aria-label="Running terminals"></nav>
    <details id="history"><summary>Conversations <span id="history-count"></span></summary><div id="history-list"></div></details>
    <button id="settings-nav" class="nav-item">Settings</button>
  </aside>
  <main id="main"></main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
