<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="super-terminal-token" content="__TOKEN__">
  <title>Super Terminal</title><link rel="stylesheet" href="/app.css">
</head>
<body>
  <aside id="sidebar">
    <select id="environment" data-requires-state aria-label="Environment"><option value="local">Local</option></select>
    <button id="conductor-nav" class="nav-item" data-requires-state>Conductor<kbd>⌘1</kbd></button>
    <button id="team-messages-nav" class="nav-item" data-requires-state hidden>Team messages</button>
    <div id="environment-status" role="status"></div>
    <nav id="terminals" aria-label="Running terminals"></nav>
    <details id="history"><summary>Conversations <span id="history-count"></span></summary><div id="history-list"></div></details>
    <button id="settings-nav" class="nav-item" data-requires-state>Settings</button>
  </aside>
  <div id="sidebar-divider" class="divider sidebar-divider" role="separator" aria-label="Resize sidebar" aria-orientation="vertical" aria-valuemin="150" aria-valuemax="460" tabindex="0"></div>
  <main id="main">
    <div id="window-toolbar" role="toolbar" aria-label="Window layout">
      <button data-layout="row" data-requires-state title="Split Right (⌘D)">Split Right</button>
      <button data-layout="column" data-requires-state title="Split Below (⇧⌘D)">Split Below</button>
      <button id="new-window" title="Open selected tab in a new window">New Window</button>
      <span class="toolbar-spacer"></span><button id="notifications-nav" data-requires-state title="Recent agent notifications">Activity <span id="activity-count"></span></button>
    </div>
    <div id="workspace"></div><div id="view-cache" hidden></div>
  </main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
