<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="super-terminal-build" content="__BUILD__"><meta name="super-terminal-data" content="__DATA_KEY__">
<meta name="super-terminal-token" content="__TOKEN__">
  <title>Super Terminal</title><link rel="stylesheet" href="/app.css">
</head>
<body>
  <aside id="sidebar" aria-label="Workspace navigation"><button id="close-sidebar" aria-label="Close navigation">Close navigation ×</button>
    <button id="session-graph-nav" class="nav-item" data-requires-state>Graph <kbd>⌘1</kbd></button>
    <button id="sessions-nav" class="nav-item" data-requires-state>Sessions <kbd>⌘2</kbd></button>
    <label id="environment-label" for="environment">Environment</label>
    <select id="environment" data-requires-state aria-label="Filter sessions by environment"><option value="local">Local</option></select>
    <div id="environment-status" role="status"></div>
    <input id="sidebar-search" type="search" aria-label="Search sessions, projects and models" placeholder="Search projects, models, sessions…">
    <nav id="terminals" aria-label="Live sessions by project"></nav>
    <details id="management-menu"><summary>More</summary>
    <button id="conductor-nav" class="nav-item" data-requires-state>Conductor</button>
    <button id="system-graph-nav" class="nav-item" data-requires-state>System graph <span id="conductor-presence"></span></button>
    <button id="overview-nav" class="nav-item" data-work-view="overview" data-requires-state>All projects</button>
    <button id="teams-nav" class="nav-item" data-work-view="teams" data-requires-state>Teams</button>
    <button id="team-messages-nav" class="nav-item" data-requires-state hidden>Team messages</button>
    <details id="history"><summary>Saved conversations <span id="history-count"></span></summary><div id="history-list"></div></details>
    <button id="docs-nav" class="nav-item" data-requires-state>Docs</button>
    <button id="settings-nav" class="nav-item" data-requires-state>Settings</button>
<section id="working-session" aria-label="Working session"></section><div id="other-sessions"></div>
</details>
  </aside>
  <button id="sidebar-scrim" tabindex="-1" aria-label="Close navigation" hidden></button>
  <div id="sidebar-divider" class="divider sidebar-divider" role="separator" aria-label="Resize sidebar" aria-orientation="vertical" aria-valuemin="150" aria-valuemax="460" tabindex="0"></div>
  <main id="main">
    <div id="window-toolbar" role="toolbar" aria-label="Window layout">
      <button id="toggle-sidebar" aria-controls="sidebar" aria-expanded="false">Navigation</button>
    <button id="graph-home" data-requires-state>Graph</button><button id="sessions-home" data-requires-state>Sessions</button>
      <button data-layout="row" data-requires-state title="Split Right (⌘D)">Split Right</button>
      <button data-layout="column" data-requires-state title="Split Below (⇧⌘D)">Split Below</button>
      <button id="new-window" title="Open selected tab in a new window">New Window</button>
      <span class="toolbar-spacer"></span><button id="notifications-nav" data-requires-state title="Recent agent notifications">Activity <span id="activity-count"></span></button>
    </div>
    <div id="service-status" role="status" hidden><span></span><button id="retry-service">Try again</button></div>
<span class="sr-only" id="tab-help">Use arrow keys to switch tabs. Press Delete to close a tab; agent processes keep running.</span><div id="workspace"></div><div id="view-cache" hidden></div>
  </main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
